name: Setup Agave
description: Install the pinned Agave CLI and optionally restore SBF platform-tools

inputs:
  sbf_tools:
    description: Restore SBF tools when building programs
    default: "true"

runs:
  using: composite
  steps:
    - name: Read Agave pin
      id: version
      shell: bash
      run: |
        version=$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/agave-version")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore Agave CLI
      id: cli
      uses: actions/cache@v6
      with:
        path: ~/.local/share/solana
        key: solana-cli-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    # cargo-build-sbf downloads its separate compiler into this directory.
    - name: Restore SBF platform-tools
      if: inputs.sbf_tools == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/solana
        key: solana-platform-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Add Agave to PATH
      shell: bash
      run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

    - name: Ensure Agave CLI is installed
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cli.outputs.cache-hit }}
        AGAVE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        if [ "$CACHE_HIT" != true ] || ! command -v cargo-build-sbf >/dev/null 2>&1; then
          installer=$(curl -fsSL "https://release.anza.xyz/$AGAVE_VERSION/install")
          sh -c "$installer"
        fi
        cargo-build-sbf --version
