name: Build or restore RedSuite
description: Cache the portable CLI separately from Agave-specific SBF fixtures

inputs:
  dlp-v2:
    description: Build the DLP scenarios with the validator's locked interface and program
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve the DLP program revision for compatibility checks
      id: dlp
      if: inputs.dlp-v2 == 'true'
      shell: bash
      working-directory: redsuite
      run: |
        revision=$(python3 - <<'PYTHON'
        import tomllib

        def pins(path):
            with open(path, "rb") as f:
                packages = {p["name"]: p for p in tomllib.load(f)["package"]}
            source = packages["magicblock-delegation-program-interface"]["source"]
            return (
                source.rsplit("#", 1)[1],
                packages["wheels"]["checksum"],
                packages["wheels-macros"]["checksum"],
            )

        validator = pins("../magicblock-validator/Cargo.lock")
        if pins("Cargo.lock") != validator:
            raise SystemExit("RedSuite and the validator pin different DLP or Wheels dependencies")
        print(validator[0])
        PYTHON
        )
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
        echo "REDSUITE_DLP_SO=$GITHUB_WORKSPACE/runroot/target/deploy/delegation_program.so" >> "$GITHUB_ENV"

    - name: Resolve RedSuite build inputs
      id: source
      shell: bash
      working-directory: redsuite
      run: |
        # Use the tracked fixture inputs, not the runner revision, for the SBF cache.
        fixtures=$(
          {
            printf '%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            cat ../magicblock-validator/.github/actions/setup-solana/agave-version
            git ls-tree HEAD -- programs shared .cargo Cargo.toml Cargo.lock rust-toolchain.toml \
              xtask/Cargo.toml xtask/src/fixtures xtask/src/main.rs
          } | git hash-object --stdin
        )
        {
          echo "sha=$(git rev-parse HEAD)"
          echo "fixtures=$fixtures"
        } >> "$GITHUB_OUTPUT"

    # Bump artifact versions when build flags or profiles change, not cache plumbing.
    - name: Restore RedSuite CLI
      id: cli
      uses: actions/cache/restore@v6
      with:
        path: redsuite-dist/redsuite
        key: redsuite-cli-v4-${{ runner.os }}-${{ runner.arch }}-release-portable-${{ steps.source.outputs.sha }}

    - name: Restore RedSuite fixtures
      id: fixtures
      uses: actions/cache/restore@v6
      with:
        path: redsuite-dist/deploy
        key: redsuite-fixtures-v5-${{ steps.source.outputs.fixtures }}-${{ steps.dlp.outputs.revision || 'rpc' }}

    - uses: ./magicblock-validator/.github/actions/setup-build-env
      id: build-env
      if: steps.cli.outputs.cache-hit != 'true' || steps.fixtures.outputs.cache-hit != 'true'
      with:
        workspace: redsuite
        cache-key: redsuite-release
        libclang: "false"

    - name: Build RedSuite CLI
      if: steps.cli.outputs.cache-hit != 'true'
      shell: bash
      working-directory: redsuite
      run: |
        cargo build --release --locked -p redsuite
        mkdir -p ../redsuite-dist
        cp target/release/redsuite ../redsuite-dist/

    - name: Save RedSuite CLI
      if: steps.cli.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: redsuite-dist/redsuite
        key: ${{ steps.cli.outputs.cache-primary-key }}

    - uses: ./magicblock-validator/.github/actions/setup-solana
      if: steps.fixtures.outputs.cache-hit != 'true'

    - name: Build RedSuite fixtures
      if: steps.fixtures.outputs.cache-hit != 'true'
      shell: bash
      working-directory: redsuite
      run: |
        env -u REDSUITE_ROOT cargo xtask programs
        mkdir -p ../redsuite-dist/deploy
        cp target/deploy/*.so ../redsuite-dist/deploy/

    - name: Checkout matching DLP program
      if: inputs.dlp-v2 == 'true' && steps.fixtures.outputs.cache-hit != 'true'
      uses: actions/checkout@v5
      with:
        repository: magicblock-labs/delegation-program
        ref: ${{ steps.dlp.outputs.revision }}
        path: delegation-program
        persist-credentials: false

    - name: Build matching DLP program
      if: inputs.dlp-v2 == 'true' && steps.fixtures.outputs.cache-hit != 'true'
      shell: bash
      working-directory: delegation-program
      run: cargo build-sbf --manifest-path program/Cargo.toml --sbf-out-dir ../redsuite-dist/deploy -- --locked

    - name: Save RedSuite fixtures
      if: steps.fixtures.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: redsuite-dist/deploy
        key: ${{ steps.fixtures.outputs.cache-primary-key }}

    - uses: ./magicblock-validator/.github/actions/save-build-cache
      with:
        workspace: redsuite
        key: ${{ steps.build-env.outputs.save-key }}
        path: ${{ steps.build-env.outputs.cache-paths }}
