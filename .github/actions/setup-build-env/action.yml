name: 'MagicBlock - Setup Build Env'
description: 'Install compilation dependencies and restore the Cargo cache'

inputs:
  workspace:
    description: Workspace path relative to github.workspace
    default: magicblock-validator
    required: false
  rust_toolchain_release:
    description: "Rust toolchain override; defaults to rust-toolchain.toml"
    required: false
  build_cache_key_name:
    description: "Build cache key"
    required: true

runs:
  using: "composite"
  steps:
    - uses: ./magicblock-validator/.github/actions/setup-protoc

    - name: Install Rust
      shell: "bash"
      working-directory: ${{ github.workspace }}/${{ inputs.workspace }}
      env:
        REQUESTED_TOOLCHAIN: ${{ inputs.rust_toolchain_release }}
      run: |
        if [ -n "$REQUESTED_TOOLCHAIN" ]; then
          rustup toolchain install "$REQUESTED_TOOLCHAIN" --profile default --component clippy
        else
          rustup toolchain install
        fi

    - name: Install system deps (libudev, LLVM/Clang)
      if: runner.os == 'Linux'
      shell: "bash"
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libudev-dev \
          libclang-dev

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.build_cache_key_name }}
        workspaces: |
          ${{ inputs.workspace }} -> target
        cache-workspace-crates: true
        cache-targets: true
        cache-all-crates: true
        cache-on-failure: true
