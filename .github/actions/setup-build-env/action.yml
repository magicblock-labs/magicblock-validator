name: 'MagicBlock - Setup Build Env'
description: 'Checkout repositories and install dependencies'

inputs:
  rust_toolchain_release:
    description: "Rust toolchain override; defaults to rust-toolchain.toml"
    required: false
  build_cache_key_name:
    description: "Build cache key"
    required: true

runs:
  using: "composite"
  steps:
  - name: Install Protoc
    shell: bash
    run: |
      # Keep the compiler on the previous installer's 26.x series.
      version=26.1
      case "$RUNNER_OS/$RUNNER_ARCH" in
        Linux/X64) platform=linux-x86_64 ;;
        Linux/ARM64) platform=linux-aarch_64 ;;
        macOS/X64) platform=osx-x86_64 ;;
        macOS/ARM64) platform=osx-aarch_64 ;;
        *) echo "Unsupported protoc platform: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
      esac
      install_dir="$(mktemp -d "$RUNNER_TEMP/protoc-$version.XXXXXX")"
      curl --fail --silent --show-error --location --retry 3 \
        "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-$platform.zip" \
        --output "$install_dir/protoc.zip"
      unzip -q "$install_dir/protoc.zip" -d "$install_dir"
      echo "$install_dir/bin" >> "$GITHUB_PATH"
      echo "PROTOC=$install_dir/bin/protoc" >> "$GITHUB_ENV"
  - name: Show Protoc version
    shell: "bash"
    run: protoc --version

  - name: Install Rust
    shell: "bash"
    working-directory: ${{ github.action_path }}/../../..
    env:
      REQUESTED_TOOLCHAIN: ${{ inputs.rust_toolchain_release }}
    run: |
      if [ -n "$REQUESTED_TOOLCHAIN" ]; then
        rustup toolchain install "$REQUESTED_TOOLCHAIN" --profile default --component clippy
      else
        rustup toolchain install
      fi

  - name: Install system deps (libudev, LLVM/Clang)
    if: runner.os == 'Linux'
    shell: "bash"
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        libudev-dev \
        libclang-dev

  - uses: Swatinem/rust-cache@v2
    with:
      shared-key: ${{ inputs.build_cache_key_name }}
      workspaces: |
        magicblock-validator -> target
      cache-targets: true
      cache-all-crates: true
      cache-on-failure: true
