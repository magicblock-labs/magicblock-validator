name: Run RedSuite
description: Build or restore artifacts, run one family, and collect logs

inputs:
  family:
    description: Redshift correctness, Redhat security, or Redline benchmarks
    required: true
  clone-url:
    description: Base-chain RPC override
    required: false
  bencher-token:
    description: Bencher API token for release benchmarks
    required: false

runs:
  using: composite
  steps:
    - name: Configure RedSuite paths
      shell: bash
      run: |
        {
          echo "REDSUITE_ROOT=$GITHUB_WORKSPACE/runroot"
          echo "REDSUITE_YELLOWSTONE_DIR=$GITHUB_WORKSPACE/yellowstone-cache"
          echo "MAGICBLOCK_VALIDATOR_BIN=$GITHUB_WORKSPACE/magicblock-validator/target/debug/magicblock-validator"
          echo "MAGICBLOCK_VERIFIER_BIN=$GITHUB_WORKSPACE/magicblock-validator/target/debug/magicblock-verifier"
        } >> "$GITHUB_ENV"

    - uses: ./magicblock-validator/.github/actions/setup-solana
      with:
        sbf_tools: "false"

    - name: Checkout redsuite
      uses: actions/checkout@v5
      with:
        repository: magicblock-labs/redsuite
        # Temporary pin to the settlement receipt parser in RedSuite PR #348.
        ref: 7267ffc08cee52e10c713a17c4252d65e5ad36a2
        path: redsuite
        persist-credentials: false

    - uses: ./magicblock-validator/.github/actions/build-redsuite

    - uses: ./magicblock-validator/.github/actions/build-er

    # snapshot_bootstrap loads this program from the Engine source tree; it is
    # not one of RedSuite's own fixture programs.
    - name: Resolve Engine revision for calculator fixture
      if: inputs.family == 'redshift'
      id: engine
      shell: bash
      working-directory: magicblock-validator
      run: |
        revision=$(python3 - <<'PY'
        import tomllib

        with open("Cargo.lock", "rb") as lockfile:
            packages = tomllib.load(lockfile)["package"]
        source = next(p["source"] for p in packages if p["name"] == "v42-calculator-interface")
        print(source.rsplit("#", 1)[1])
        PY
        )
        echo "revision=$revision" >> "$GITHUB_OUTPUT"

    - name: Checkout Engine for calculator fixture
      if: inputs.family == 'redshift'
      uses: actions/checkout@v5
      with:
        repository: magicblock-labs/magicblock-engine
        ref: ${{ steps.engine.outputs.revision }}
        path: magicblock-engine
        persist-credentials: false

    - name: Install Engine Rust toolchain
      if: inputs.family == 'redshift'
      shell: bash
      working-directory: magicblock-engine
      run: rustup toolchain install

    - uses: ./magicblock-validator/.github/actions/setup-solana
      if: inputs.family == 'redshift'
      with:
        sbf_tools: "true"

    - name: Build v42 calculator fixture
      if: inputs.family == 'redshift'
      shell: bash
      working-directory: magicblock-engine
      run: |
        env -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER cargo build-sbf \
          --manifest-path programs/v42-calculator-program/Cargo.toml \
          --arch v3 --sbf-out-dir target/deploy -- --locked

    - name: Stage v42 calculator beside validator binary
      if: inputs.family == 'redshift'
      shell: bash
      run: |
        mkdir -p magicblock-validator/target/deploy
        cp magicblock-engine/target/deploy/v42_calculator_program.so \
          magicblock-validator/target/deploy/

    - name: Cache Yellowstone plugin
      uses: actions/cache@v6
      with:
        path: ${{ env.REDSUITE_YELLOWSTONE_DIR }}
        key: >-
          yellowstone-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(
            'magicblock-validator/.github/actions/setup-solana/agave-version',
            'redsuite/crates/redsuite-core/src/topology/yellowstone.rs'
          ) }}

    - name: Prepare run root
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p runroot/target/deploy runroot/target/redsuite-stack
        cp redsuite-dist/deploy/* runroot/target/deploy/
        chmod +x redsuite-dist/redsuite "$MAGICBLOCK_VALIDATOR_BIN" "$MAGICBLOCK_VERIFIER_BIN"
        test -x "$MAGICBLOCK_VALIDATOR_BIN" -a -x "$MAGICBLOCK_VERIFIER_BIN"

    - name: Run RedSuite
      shell: bash
      run: bash magicblock-validator/.github/scripts/run-redsuite.sh "$REDSUITE_FAMILY"
      env:
        REDSUITE_FAMILY: ${{ inputs.family }}
        REDSUITE_CLONE_URL: ${{ inputs.clone-url }}
        RUST_LOG: info

    - name: Upload stack logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: redsuite-stack-logs-${{ inputs.family }}
        path: runroot/target/redsuite-stack/*.log*
        retention-days: 3
        if-no-files-found: ignore

    - name: Upload benchmark reports
      if: always() && inputs.family == 'redline'
      uses: actions/upload-artifact@v7
      with:
        name: redsuite-reports-${{ inputs.family }}
        path: runroot/target/redsuite-reports/
        retention-days: 90
        if-no-files-found: ignore

    - name: Track benchmark results
      if: inputs.family == 'redline'
      uses: ./magicblock-validator/.github/actions/track-benchmarks
      with:
        token: ${{ inputs.bencher-token }}
        branch: ${{ github.event.release.target_commitish || github.ref_name }}

    - name: Stack down
      if: always()
      shell: bash
      run: |
        if [ -x ./redsuite-dist/redsuite ]; then
          ./redsuite-dist/redsuite stack down
        fi
