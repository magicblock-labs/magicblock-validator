name: Run RedSuite
description: Prepare artifacts, run one family, and collect logs

inputs:
  family:
    description: Redshift correctness, Redhat security, or Redline benchmarks
    required: true
  clone-url:
    description: Base-chain RPC override
    required: false
  bencher-token:
    description: Bencher API token for release benchmarks
    required: false

runs:
  using: composite
  steps:
    - name: Download RedSuite release artifacts
      id: redsuite
      shell: bash
      env:
        REDSUITE_VERSION: "3.7.2"
      run: |
        set -euo pipefail

        download() (
          local release=$1 archive=$2.tar.gz checksum
          local base="https://github.com/magicblock-labs/redsuite/releases/download/$release"
          echo "Downloading $archive from RedSuite $release"
          cd "$downloads"
          curl --fail-early --fail --silent --show-error --location --retry 3 --remote-name-all \
            "$base/$archive" "$base/$archive.sha256"
          read -r checksum _ < "$archive.sha256"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check -
        )

        downloads=$(mktemp -d)
        trap 'rm -rf "$downloads"' EXIT
        runner="redsuite-runner-$REDSUITE_VERSION-x86_64-unknown-linux-gnu"
        download "$REDSUITE_VERSION" "$runner"
        tar -xzf "$downloads/$runner.tar.gz" -C "$downloads"

        pins=$(python3 - "$downloads/$runner/components.toml" <<'PYTHON'
        import sys
        import tomllib

        with open(sys.argv[1], "rb") as file:
            components = tomllib.load(file)
        fixtures = components["fixtures"]
        yellowstone = components["yellowstone"]["version"]
        agave = components["agave"]["version"]
        print(fixtures["release"], fixtures["version"], f"v{yellowstone}+solana.{agave}")
        PYTHON
        )
        read -r fixture_release fixture_version yellowstone_tag <<< "$pins"

        fixtures="redsuite-fixtures-$fixture_version"
        download "$fixture_release" "$fixtures"
        mkdir -p redsuite-dist
        tar -xzf "$downloads/$fixtures.tar.gz" -C redsuite-dist
        install -m 755 "$downloads/$runner/bin/redsuite" redsuite-dist/redsuite

        {
          echo "REDSUITE_ROOT=$GITHUB_WORKSPACE/runroot"
          echo "REDSUITE_FIXTURES_DIR=$GITHUB_WORKSPACE/redsuite-dist/$fixtures"
          echo "REDSUITE_YELLOWSTONE_DIR=$GITHUB_WORKSPACE/yellowstone-cache"
          echo "MAGICBLOCK_VALIDATOR_BIN=$GITHUB_WORKSPACE/magicblock-validator/target/debug/magicblock-validator"
          echo "MAGICBLOCK_VERIFIER_BIN=$GITHUB_WORKSPACE/magicblock-validator/target/debug/magicblock-verifier"
        } >> "$GITHUB_ENV"
        echo "yellowstone-tag=$yellowstone_tag" >> "$GITHUB_OUTPUT"

    - uses: ./magicblock-validator/.github/actions/setup-solana
      with:
        sbf_tools: "false"

    - uses: ./magicblock-validator/.github/actions/build-er

    # snapshot_bootstrap loads this program from the Engine source tree; it is
    # not one of RedSuite's own fixture programs.
    - name: Resolve Engine revision for calculator fixture
      if: inputs.family == 'redshift'
      id: engine
      shell: bash
      working-directory: magicblock-validator
      run: |
        revision=$(python3 - <<'PY'
        import tomllib

        with open("Cargo.lock", "rb") as lockfile:
            packages = tomllib.load(lockfile)["package"]
        source = next(p["source"] for p in packages if p["name"] == "v42-calculator-interface")
        print(source.rsplit("#", 1)[1])
        PY
        )
        echo "revision=$revision" >> "$GITHUB_OUTPUT"

    # Bump the cache version when the SBF build flags or artifact format change.
    - name: Restore v42 calculator fixture
      if: inputs.family == 'redshift'
      id: calculator
      uses: actions/cache/restore@v6
      with:
        path: calculator-dist/v42_calculator_program.so
        key: >-
          calculator-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine.outputs.revision }}-${{
            hashFiles('magicblock-validator/.github/actions/setup-solana/agave-version')
          }}

    - name: Checkout Engine for calculator fixture
      if: inputs.family == 'redshift' && steps.calculator.outputs.cache-hit != 'true'
      uses: actions/checkout@v5
      with:
        repository: magicblock-labs/magicblock-engine
        ref: ${{ steps.engine.outputs.revision }}
        path: magicblock-engine
        persist-credentials: false

    - name: Install Engine Rust toolchain
      if: inputs.family == 'redshift' && steps.calculator.outputs.cache-hit != 'true'
      shell: bash
      working-directory: magicblock-engine
      run: rustup toolchain install

    - uses: ./magicblock-validator/.github/actions/setup-solana
      if: inputs.family == 'redshift' && steps.calculator.outputs.cache-hit != 'true'
      with:
        sbf_tools: "true"

    - name: Build v42 calculator fixture
      if: inputs.family == 'redshift' && steps.calculator.outputs.cache-hit != 'true'
      shell: bash
      working-directory: magicblock-engine
      run: |
        env -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER cargo build-sbf \
          --manifest-path programs/v42-calculator-program/Cargo.toml \
          --arch v3 --sbf-out-dir target/deploy -- --locked

    - name: Save v42 calculator fixture
      if: inputs.family == 'redshift' && steps.calculator.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p calculator-dist
        cp magicblock-engine/target/deploy/v42_calculator_program.so calculator-dist/

    - name: Cache v42 calculator fixture
      if: inputs.family == 'redshift' && steps.calculator.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: calculator-dist/v42_calculator_program.so
        key: ${{ steps.calculator.outputs.cache-primary-key }}

    - name: Stage v42 calculator beside validator binary
      if: inputs.family == 'redshift'
      shell: bash
      run: |
        mkdir -p magicblock-validator/target/deploy
        cp calculator-dist/v42_calculator_program.so \
          magicblock-validator/target/deploy/

    - name: Cache Yellowstone plugin
      uses: actions/cache@v6
      with:
        path: ${{ env.REDSUITE_YELLOWSTONE_DIR }}
        key: yellowstone-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.redsuite.outputs.yellowstone-tag }}

    - name: Run RedSuite
      shell: bash
      run: bash magicblock-validator/.github/scripts/run-redsuite.sh "$REDSUITE_FAMILY"
      env:
        REDSUITE_FAMILY: ${{ inputs.family }}
        REDSUITE_CLONE_URL: ${{ inputs.clone-url }}
        RUST_LOG: ${{ inputs.family == 'redline' && 'info' || 'info,redsuite::suite=debug' }}

    - name: Upload stack logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: redsuite-stack-logs-${{ inputs.family }}
        path: runroot/target/redsuite-stack/*.log*
        retention-days: 3
        if-no-files-found: ignore

    - name: Upload benchmark reports
      if: always() && inputs.family == 'redline'
      uses: actions/upload-artifact@v7
      with:
        name: redsuite-reports-${{ inputs.family }}
        path: runroot/target/redsuite-reports/
        retention-days: 90
        if-no-files-found: ignore

    - name: Track benchmark results
      if: inputs.family == 'redline'
      uses: ./magicblock-validator/.github/actions/track-benchmarks
      with:
        token: ${{ inputs.bencher-token }}
        branch: ${{ github.event.release.target_commitish || github.ref_name }}

    - name: Stack down
      if: always()
      shell: bash
      run: |
        if [ -x ./redsuite-dist/redsuite ]; then
          ./redsuite-dist/redsuite stack down
        fi
