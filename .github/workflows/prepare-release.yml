name: Prepare release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.13.11); defaults to the next patch version"
        required: false
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare release PR
    runs-on: blacksmith-32vcpu-ubuntu-2404
    env:
      HOST_CARGO_JOBS: "8"
      # Releases are always cut from master, regardless of the default branch.
      RELEASE_BASE_BRANCH: master
    steps:
      - name: Require release base branch
        if: github.ref_name != env.RELEASE_BASE_BRANCH
        shell: bash
        run: |
          echo "::error::Releases are cut from ${RELEASE_BASE_BRANCH}; run this workflow on ${RELEASE_BASE_BRANCH}."
          exit 1

      # The workflow and the code it releases come from the same commit.
      - name: Checkout release base branch
        uses: actions/checkout@v5
        with:
          path: magicblock-validator
          fetch-depth: 0
          persist-credentials: false

      - name: Require identical release workflows on dev
        working-directory: magicblock-validator
        shell: bash
        run: |
          if ! git diff --exit-code origin/dev HEAD -- \
            .github/workflows/prepare-release.yml \
            .github/workflows/release-tag.yml \
            .github/scripts/workspace-version.sh; then
            echo "::error::Release workflows differ between dev and ${RELEASE_BASE_BRANCH}; land the same change on both branches."
            exit 1
          fi

      - uses: ./magicblock-validator/.github/actions/setup-build-env
        with:
          cache-key: prepare-release

      - name: Determine release version
        working-directory: magicblock-validator
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          current_version="$(.github/scripts/workspace-version.sh)"

          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid current workspace version: $current_version" >&2
            exit 1
          fi

          current_major=$((10#${BASH_REMATCH[1]}))
          current_minor=$((10#${BASH_REMATCH[2]}))
          current_patch=$((10#${BASH_REMATCH[3]}))

          if [[ -z "$INPUT_VERSION" ]]; then
            version="${current_major}.${current_minor}.$((current_patch + 1))"
          else
            requested_version="${INPUT_VERSION#v}"
            if [[ ! "$requested_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Version must have the form X.Y.Z or vX.Y.Z" >&2
              exit 1
            fi

            new_major=$((10#${BASH_REMATCH[1]}))
            new_minor=$((10#${BASH_REMATCH[2]}))
            new_patch=$((10#${BASH_REMATCH[3]}))

            if (( new_major < current_major ||
                  (new_major == current_major && new_minor < current_minor) ||
                  (new_major == current_major && new_minor == current_minor && new_patch <= current_patch) )); then
              echo "Version must be newer than $current_version" >&2
              exit 1
            fi

            version="${new_major}.${new_minor}.${new_patch}"
          fi

          release_branch="release/v${version}"
          remote_branch="$(git ls-remote --heads origin "refs/heads/${release_branch}")"
          if [[ -n "$remote_branch" ]]; then
            echo "Branch $release_branch already exists" >&2
            exit 1
          fi
          remote_tag="$(git ls-remote --tags origin "refs/tags/v${version}")"
          if [[ -n "$remote_tag" ]]; then
            echo "Tag v${version} already exists" >&2
            exit 1
          fi

          git switch --create "$release_branch"
          {
            echo "CURRENT_VERSION=$current_version"
            echo "VERSION=$version"
            echo "RELEASE_BRANCH=$release_branch"
          } >> "$GITHUB_ENV"

          echo "Preparing v${version} from v${current_version} (base: ${RELEASE_BASE_BRANCH})" >> "$GITHUB_STEP_SUMMARY"

      - name: Set workspace version
        working-directory: magicblock-validator
        shell: bash
        run: |
          set -euo pipefail

          awk -v version="$VERSION" '
            BEGIN { in_section = 0; updated = 0 }
            $0 == "[workspace.package]" {
              in_section = 1
              print
              next
            }
            in_section && /^\[/ { in_section = 0 }
            in_section && /^version = "/ {
              print "version = \"" version "\""
              updated++
              next
            }
            { print }
            END { if (updated != 1) exit 1 }
          ' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - name: Align package versions
        working-directory: magicblock-validator/.github
        shell: bash
        run: ./version-align.sh

      # Re-resolving a lockfile can switch third-party versions (it paired five8 1.0.0
      # with five8_core 0.1.2, which does not compile), so a release moves only the
      # repository's own packages to the new version and builds what master tested.
      - name: Set package versions in lockfiles
        working-directory: magicblock-validator
        shell: bash
        run: |
          set -euo pipefail
          for lockfile in Cargo.lock test-integration/Cargo.lock; do
            [[ -f "$lockfile" ]] || continue
            awk -v from="$CURRENT_VERSION" -v to="$VERSION" '
              BEGIN { RS = "" }
              # First pass: local packages (no source) at the old version.
              NR == FNR {
                if ($0 !~ /\nsource = / && index($0 "\n", "\nversion = \"" from "\"\n") && match($0, /\nname = "[^"]+"/))
                  local[substr($0, RSTART + 9, RLENGTH - 10)] = 1
                next
              }
              # Second pass: move them, and every reference pinned to them, to the new version.
              {
                block = $0
                if (block !~ /\nsource = / && match(block, /\nname = "[^"]+"/) && substr(block, RSTART + 9, RLENGTH - 10) in local)
                  block = swap(block, "\nversion = \"" from "\"", "\nversion = \"" to "\"")
                for (name in local)
                  block = swap(block, "\"" name " " from "\"", "\"" name " " to "\"")
                printf "%s%s", (FNR > 1 ? "\n\n" : ""), block
              }
              END { print "" }
              function swap(s, old, new,    i, out) {
                out = ""
                while ((i = index(s, old)) > 0) {
                  out = out substr(s, 1, i - 1) new
                  s = substr(s, i + length(old))
                }
                return out s
              }
            ' "$lockfile" "$lockfile" > "$lockfile.tmp"
            mv "$lockfile.tmp" "$lockfile"
          done

      - name: Build workspaces
        working-directory: magicblock-validator
        shell: bash
        run: |
          set -euo pipefail
          for manifest in Cargo.toml test-integration/Cargo.toml; do
            [[ -f "$manifest" ]] || continue
            cargo build --workspace --locked --manifest-path "$manifest" --jobs "$HOST_CARGO_JOBS"
          done

      - name: Commit and push release branch
        working-directory: magicblock-validator
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No release changes were generated" >&2
            exit 1
          fi
          git commit -m "chore(release): prepare v${VERSION}"
          gh auth setup-git
          git push --set-upstream origin "$RELEASE_BRANCH"

      - name: Create pull request
        working-directory: magicblock-validator
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        run: |
          gh pr create \
            --base "$RELEASE_BASE_BRANCH" \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): prepare v${VERSION}" \
            --body ""
