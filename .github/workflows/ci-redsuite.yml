name: RedSuite

on:
  workflow_call:
    inputs:
      benchmarks:
        description: Run release benchmarks instead of correctness and security
        type: boolean
        default: false
      redsuite_revision:
        description: RedSuite revision override; empty uses the pinned revision
        type: string
        default: ''

permissions:
  contents: read

env:
  REDSUITE_REPO: magicblock-labs/redsuite
  REDSUITE_REV: ${{ inputs.redsuite_revision || 'c971612b3db94afa7c845f39ee72aa413a33a03b' }}

jobs:
  run_redsuite:
    name: RedSuite ${{ inputs.benchmarks && 'benchmarks' || 'correctness security' }}
    runs-on: ${{ inputs.benchmarks && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      REDSUITE_ROOT: ${{ github.workspace }}/runroot
      REDSUITE_YELLOWSTONE_DIR: ${{ github.workspace }}/yellowstone-cache
      MAGICBLOCK_VALIDATOR_BIN: ${{ github.workspace }}/magicblock-validator/target/debug/magicblock-validator
      MAGICBLOCK_VERIFIER_BIN: ${{ github.workspace }}/magicblock-validator/target/debug/magicblock-verifier
      REDSUITE_MODE: ${{ inputs.benchmarks && 'benchmarks' || 'checks' }}
    steps:
      - name: Checkout this magicblock-validator
        uses: actions/checkout@v5
        with:
          path: magicblock-validator
          persist-credentials: false

      - uses: ./magicblock-validator/.github/actions/setup-solana
        id: agave
        with:
          sbf_tools: "false"

      - name: Record actual runner resources
        run: |
          nproc
          lscpu
          free -h
          df -h .
          for metric in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max; do
            if [ -r "$metric" ]; then
              echo "$metric"
              cat "$metric"
            fi
          done

      - name: Checkout redsuite
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REDSUITE_REPO }}
          ref: ${{ env.REDSUITE_REV }}
          path: redsuite
          persist-credentials: false

      - uses: ./magicblock-validator/.github/actions/build-redsuite
        with:
          agave_version: ${{ steps.agave.outputs.agave_version }}

      - uses: ./magicblock-validator/.github/actions/build-er
        with:
          agave_version: ${{ steps.agave.outputs.agave_version }}

      - name: Cache Yellowstone plugin
        uses: actions/cache@v6
        with:
          path: ${{ env.REDSUITE_YELLOWSTONE_DIR }}
          key: >-
            yellowstone-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.agave.outputs.agave_version }}-${{ hashFiles(
              'redsuite/crates/redsuite-core/src/topology/yellowstone.rs'
            ) }}

      - name: Prepare run root
        run: |
          set -euxo pipefail
          mkdir -p runroot/target/deploy runroot/target/redsuite-stack
          cp redsuite-dist/deploy/* runroot/target/deploy/
          chmod +x redsuite-dist/redsuite "$MAGICBLOCK_VALIDATOR_BIN" "$MAGICBLOCK_VERIFIER_BIN"
          test -x "$MAGICBLOCK_VALIDATOR_BIN" -a -x "$MAGICBLOCK_VERIFIER_BIN"

      - name: Run RedSuite
        run: bash magicblock-validator/.github/scripts/run-redsuite.sh "$REDSUITE_MODE"
        env:
          REDSUITE_CLONE_URL: ${{ secrets.REDSUITE_CLONE_URL }}
          RUST_LOG: info,redsuite_core::check=debug

      - name: Record peak memory, CPU use and final disk use
        if: always()
        run: |
          df -h .
          for metric in /sys/fs/cgroup/memory.peak /sys/fs/cgroup/cpu.stat; do
            if [ -r "$metric" ]; then
              echo "$metric"
              cat "$metric"
            fi
          done

      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redsuite-stack-logs-${{ env.REDSUITE_MODE }}
          path: runroot/target/redsuite-stack/*.log*
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload benchmark reports
        if: always() && inputs.benchmarks
        uses: actions/upload-artifact@v7
        with:
          name: redsuite-reports-${{ env.REDSUITE_MODE }}
          path: runroot/target/redsuite-reports/
          retention-days: 90
          if-no-files-found: ignore

      - name: Track benchmark results
        if: inputs.benchmarks
        uses: ./magicblock-validator/.github/actions/track-benchmarks
        with:
          token: ${{ secrets.BENCHER_API_TOKEN }}
          branch: ${{ github.event.release.target_commitish || github.ref_name }}

      - name: Stack down
        if: always()
        run: |
          if [ -x ./redsuite-dist/redsuite ]; then
            ./redsuite-dist/redsuite stack down
          fi
