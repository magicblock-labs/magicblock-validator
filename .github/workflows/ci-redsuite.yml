name: Run CI - RedSuite

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Also run the redline benchmarks
        type: boolean
        default: false
  release:
    types: [published]
  push:
    branches: [master, dev]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/build.rs'
      - '**/*.proto'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci-redsuite.yml'
      - '.github/actions/setup-build-env/**'
      - '.github/actions/setup-solana/**'
  pull_request:
    branches: [master, dev]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/build.rs'
      - '**/*.proto'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci-redsuite.yml'
      - '.github/actions/setup-build-env/**'
      - '.github/actions/setup-solana/**'

permissions:
  contents: read

env:
  REDSUITE_REPO: magicblock-labs/redsuite
  REDSUITE_REV: 0.3.0
  BENCHER_PROJECT: 019f8273-ddb4-7dc3-99f7-44e7fe7c4f36
  BENCHER_TESTBED: blacksmith-16vcpu-ubuntu-2404

jobs:
  build_er:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    name: Build ER Release Artifact
    timeout-minutes: 90
    env:
      HOST_CARGO_JOBS: "8"
    steps:
      - name: Checkout this magicblock-validator
        uses: actions/checkout@v5
        with:
          path: magicblock-validator
          persist-credentials: false

      - uses: ./magicblock-validator/.github/actions/setup-build-env
        with:
          build_cache_key_name: "magicblock-validator-ci-redsuite-${{ hashFiles('magicblock-validator/Cargo.lock') }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lld linker
        run: sudo apt-get update && sudo apt-get install -y lld
        shell: bash

      - name: Build validator and verifier release binaries
        run: |
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -C target-cpu=native" \
            cargo build --release --locked \
              --bin magicblock-validator --bin magicblock-verifier \
              -j "$HOST_CARGO_JOBS"
        shell: bash
        working-directory: magicblock-validator

      - uses: ./magicblock-validator/.github/actions/setup-solana

      - name: Build committor program
        run: |
          cargo build-sbf --manifest-path magicblock-committor-program/Cargo.toml \
            --sbf-out-dir target/deploy/ --quiet
          test -f target/deploy/magicblock_committor_program.so
        shell: bash
        working-directory: magicblock-validator

      - name: Upload ER + verifier + committor artifact
        uses: actions/upload-artifact@v4
        with:
          name: redsuite-er-bin
          path: |
            magicblock-validator/target/release/magicblock-validator
            magicblock-validator/target/release/magicblock-verifier
            magicblock-validator/target/deploy/magicblock_committor_program.so
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  plan:
    runs-on: ubuntu-latest
    name: Select suites
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        run: |
          set -euo pipefail
          correctness='{"suite":"correctness","targets":"redshift redhat"}'
          benchmarks='{"suite":"benchmarks","targets":"redline"}'
          if [ "$RUN_BENCHMARKS" = "true" ]; then
            echo "matrix=[$correctness,$benchmarks]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[$correctness]" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
        env:
          RUN_BENCHMARKS: >-
            ${{
              github.event_name == 'release'
              || (github.event_name == 'push' && github.ref == 'refs/heads/master')
              || (github.event_name == 'workflow_dispatch' && inputs.benchmarks)
            }}

  run_redsuite:
    needs: [build_er, plan]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    name: RedSuite ${{ matrix.suite }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    env:
      REDSUITE_ROOT: ${{ github.workspace }}/runroot
      MAGICBLOCK_VALIDATOR_BIN: ${{ github.workspace }}/magicblock-validator/target/release/magicblock-validator
      MAGICBLOCK_VERIFIER_BIN: ${{ github.workspace }}/magicblock-validator/target/release/magicblock-verifier
    steps:
      - name: Checkout this magicblock-validator
        uses: actions/checkout@v5
        with:
          path: magicblock-validator
          persist-credentials: false

      - uses: ./magicblock-validator/.github/actions/setup-solana
        id: agave

      - name: Restore redsuite build
        id: redsuite-cache
        uses: actions/cache@v4
        with:
          path: redsuite-dist
          key: redsuite-bin-${{ env.REDSUITE_REV }}-agave${{ steps.agave.outputs.agave_version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Checkout redsuite
        if: steps.redsuite-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REDSUITE_REPO }}
          ref: ${{ env.REDSUITE_REV }}
          path: redsuite
          persist-credentials: false

      - name: Build redsuite
        if: steps.redsuite-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rustup toolchain install
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-cpu=native" \
            cargo build --release --locked -p redsuite
          env -u REDSUITE_ROOT cargo xtask programs
          mkdir -p ../redsuite-dist/deploy
          cp target/release/redsuite ../redsuite-dist/
          cp target/deploy/*.so target/deploy/fixtures.json ../redsuite-dist/deploy/
          rm -rf target
        shell: bash
        working-directory: redsuite

      - name: Download ER + verifier + committor artifact
        uses: actions/download-artifact@v4
        with:
          name: redsuite-er-bin
          path: magicblock-validator/target

      - name: Prepare run root
        run: |
          set -euxo pipefail
          mkdir -p runroot/target/deploy runroot/target/redsuite-stack
          cp redsuite-dist/deploy/* runroot/target/deploy/
          chmod +x redsuite-dist/redsuite "$MAGICBLOCK_VALIDATOR_BIN" "$MAGICBLOCK_VERIFIER_BIN"
          test -x "$MAGICBLOCK_VALIDATOR_BIN" -a -x "$MAGICBLOCK_VERIFIER_BIN"
        shell: bash

      - name: Run redsuite ${{ matrix.suite }} suite
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --nofile=1048576:1048576
          sudo sysctl fs.inotify.max_user_instances=1280
          sudo sysctl fs.inotify.max_user_watches=655360
          [ -n "${REDSUITE_CLONE_URL:-}" ] || unset REDSUITE_CLONE_URL
          for target in $TARGETS; do
            ./redsuite-dist/redsuite run "$target" --profile lite
          done
        shell: bash
        env:
          REDSUITE_CLONE_URL: ${{ secrets.REDSUITE_CLONE_URL }}
          TARGETS: ${{ matrix.targets }}

      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redsuite-stack-logs-${{ matrix.suite }}
          path: runroot/target/redsuite-stack/*.log*
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload scenario reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redsuite-reports-${{ matrix.suite }}
          path: runroot/target/redsuite-reports/
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          if-no-files-found: ignore

      - name: Export Bencher Metric Format
        if: matrix.suite == 'benchmarks'
        run: ./redsuite-dist/redsuite report bmf --out redsuite-bmf.json
        shell: bash

      - uses: bencherdev/bencher@v0.6.10
        if: matrix.suite == 'benchmarks'

      - name: Track results with Bencher
        if: matrix.suite == 'benchmarks'
        run: |
          set -euo pipefail
          if [ -z "${BENCHER_API_KEY:-}" ]; then
            echo "BENCHER_API_KEY not set — skipping Bencher tracking"
            exit 0
          fi
          bencher run \
            --project "$BENCHER_PROJECT" \
            --key "$BENCHER_API_KEY" \
            --branch "$BENCHER_BRANCH" \
            --testbed "$BENCHER_TESTBED" \
            --threshold-measure latency \
            --threshold-test t_test \
            --threshold-min-sample-size 4 \
            --threshold-max-sample-size 30 \
            --threshold-lower-boundary _ \
            --threshold-upper-boundary 0.99 \
            --threshold-measure throughput \
            --threshold-test t_test \
            --threshold-min-sample-size 4 \
            --threshold-max-sample-size 30 \
            --threshold-lower-boundary 0.99 \
            --threshold-upper-boundary _ \
            --thresholds-reset \
            --adapter json \
            --file redsuite-bmf.json
        shell: bash
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
          BENCHER_BRANCH: ${{ github.event.release.target_commitish || github.ref_name }}

      - name: Stack down
        if: always()
        run: ./redsuite-dist/redsuite stack down
        shell: bash
