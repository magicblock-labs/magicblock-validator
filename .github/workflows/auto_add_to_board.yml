name: Magic Lab Project Automation

on:
  issues:
    types: [opened, reopened, transferred, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, labeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  magic-lab:
    name: Update Magic Lab
    uses: magicblock-labs/.github/.github/workflows/magic_lab_automation.yml@0417a60a84bff30607ea604790b81a44df6d7e3b
    secrets:
      ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
