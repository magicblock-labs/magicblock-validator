name: Publish ephemeral validator packages and crates

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_version }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  push:
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Stable v2 tag to dry-run from master (for example v2.0.4)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.release_version }}
  NPM_CHANNEL: ${{ startsWith(github.event.release.tag_name || inputs.release_version, 'v1.') && 'legacy' || 'latest' }}
  DRY_RUN: ${{ github.event_name != 'release' }}
  RELEASE_BINARIES: magicblock-validator magicblock-verifier magicblock magicblock-validator-tui

jobs:
  validate-release-branch:
    name: Validate release branch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this magicblock-validator
        uses: actions/checkout@v5
        with:
          path: magicblock-validator

      - name: Check versions are aligned
        shell: bash
        run: |
          cd magicblock-validator/.github && ./version-align.sh --check

  resolve-dry-run:
    name: Resolve tagged source for dry run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require master dispatch
        if: github.ref != 'refs/heads/master'
        shell: bash
        run: |
          echo "::error::Run the v2 package dry run from master after the release is tagged."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and pin release tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The package dry run requires a stable v2 tag."
            exit 1
          fi
          if ! commit=$(git rev-parse --verify "refs/tags/${RELEASE_VERSION}^{commit}"); then
            echo "::error::Tag ${RELEASE_VERSION} has not been created."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" HEAD ||
             [[ "v$(.github/scripts/workspace-version.sh "$commit")" != "$RELEASE_VERSION" ]]; then
            echo "::error::Tag ${RELEASE_VERSION} must point to a master commit carrying that version."
            exit 1
          fi
          if ! git cat-file -e "$commit:.github/actions/build-release-binaries/action.yml"; then
            echo "::error::Tag ${RELEASE_VERSION} predates the master-based package dry run."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # A release event runs this workflow from the tagged commit, so this guard must
  # exist on every branch a tag could point at.
  verify-release:
    name: Verify release source
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this magicblock-validator
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release-line commit carrying the tagged version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          problem=""
          case "$TAG" in
            v1.*) branch=V1 ;;
            v2.*) branch=master ;;
            *) echo "::error::Unsupported release line: $TAG"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            problem="${TAG} points at ${GITHUB_SHA}, which is not on $branch"
          elif ! version="v$(.github/scripts/workspace-version.sh)"; then
            problem="${TAG} points at a commit without a valid workspace version"
          elif [[ "$version" != "$TAG" ]]; then
            problem="${TAG} points at a commit versioned ${version}"
          fi
          if [[ -n "$problem" ]]; then
            gh release edit "$TAG" --draft=true
            echo "::error::${problem}. The release is back in draft; release tags come from the matching release branch."
            exit 1
          fi

  set-release-channel:
    name: Set GitHub release channel
    needs: verify-release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set latest policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then
            gh release edit "$RELEASE_VERSION" --prerelease --latest=false
          else
            gh release edit "$RELEASE_VERSION" --latest=${{ startsWith(github.event.release.tag_name, 'v2.') && !github.event.release.prerelease && 'true' || 'false' }}
          fi

  publish-binaries:
    name: Publish Binaries
    permissions:
      contents: write
    needs: [verify-release, resolve-dry-run]
    if: >-
      ${{ !cancelled() &&
          (needs.resolve-dry-run.result == 'success' ||
            (needs.verify-release.result == 'success' &&
             !github.event.release.prerelease &&
             !contains(github.event.release.tag_name, '-rc.'))) }}
    runs-on: ${{ matrix.build.OS }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
            NAME: linux-x64-glibc,
            OS: ubuntu-latest,
            TARGET: x86_64-unknown-linux-gnu
          }
          - {
            NAME: linux-arm64-glibc,
            OS: arm64,
            TARGET: aarch64-unknown-linux-gnu
          }
          - {
            NAME: darwin-x64,
            OS: macos-15-intel,
            TARGET: x86_64-apple-darwin
          }
          - {
            NAME: darwin-arm64,
            OS: macos-latest,
            TARGET: aarch64-apple-darwin
          }

    steps:
      - name: Checkout this magicblock-validator
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-dry-run.outputs.commit || github.sha }}
          path: magicblock-validator
          persist-credentials: false

      - uses: ./magicblock-validator/.github/actions/build-release-binaries
        id: binaries
        with:
          target: ${{ matrix.build.TARGET }}
          runner-label: ${{ matrix.build.OS }}
          save-cache: ${{ env.DRY_RUN }}

      - name: Check versions are aligned
        shell: bash
        working-directory: magicblock-validator/.github
        run: ./version-align.sh --check

      - name: Build the NPM package
        working-directory: magicblock-validator
        shell: bash
        env:
          ASSET_SUFFIX: ${{ matrix.build.NAME }}
        run: |
          set -euo pipefail
          bin="ephemeral-validator"
          export node_os="${ASSET_SUFFIX%%-*}"
          arch="${ASSET_SUFFIX#*-}"
          export node_arch="${arch%%-*}"
          export node_pkg="${bin}-${node_os}-${node_arch}"
          echo "node_pkg=${node_pkg}" >> "$GITHUB_ENV"
          mkdir -p "${node_pkg}/bin"
          envsubst < .github/packages/npm-package/package.json.tmpl > "${node_pkg}/package.json"
          cat "${node_pkg}/package.json"
          cp "release-dist/magicblock-validator" "${node_pkg}/bin/${bin}"
          for artifact in $RELEASE_BINARIES; do
            cp "release-dist/$artifact" "$artifact-$ASSET_SUFFIX"
          done

      - name: Publish binaries to GitHub release
        if: env.DRY_RUN == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_SUFFIX: ${{ matrix.build.NAME }}
        working-directory: magicblock-validator
        run: |
          set -euo pipefail
          for artifact in $RELEASE_BINARIES; do
            gh release upload "$RELEASE_VERSION" "$artifact-$ASSET_SUFFIX" --clobber
          done

      - name: Publish the NPM package
        working-directory: magicblock-validator
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd "$node_pkg"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running npm publish in dry-run mode"
            npm publish --access public --tag "$NPM_CHANNEL" --dry-run
          else
            npm publish --access public --tag "$NPM_CHANNEL"
          fi

      - name: Save validated release binaries
        if: env.DRY_RUN == 'true' && steps.binaries.outputs.restored != 'true'
        uses: actions/cache/save@v6
        with:
          path: magicblock-validator/release-dist
          key: ${{ steps.binaries.outputs.key }}

  publish-v42:
    name: Publish v42 calculator
    needs: [publish-binaries, resolve-dry-run]
    if: ${{ !cancelled() && needs.publish-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validator release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-dry-run.outputs.commit || github.sha }}
          path: magicblock-validator
          persist-credentials: false

      - name: Resolve locked Engine revision
        id: engine
        working-directory: magicblock-validator
        shell: bash
        run: |
          set -euo pipefail
          revision=$(python3 - <<'PY'
          import tomllib

          with open("Cargo.lock", "rb") as lockfile:
              packages = tomllib.load(lockfile)["package"]
          source = next(p["source"] for p in packages if p["name"] == "v42-calculator-interface")
          print(source.rsplit("#", 1)[1])
          PY
          )
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # Bump the format when the SBF build recipe changes.
      - name: Restore release calculator
        id: calculator
        uses: actions/cache/restore@v6
        with:
          path: release-sbf/v42_calculator_program.so
          key: >-
            release-v42-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine.outputs.revision }}-${{
              hashFiles('magicblock-validator/.github/actions/setup-solana/agave-version')
            }}

      - name: Check calculator
        if: steps.calculator.outputs.cache-hit == 'true'
        id: sbf
        shell: bash
        run: |
          if [[ -s release-sbf/v42_calculator_program.so ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Engine
        if: steps.sbf.outputs.ready != 'true'
        uses: actions/checkout@v5
        with:
          repository: magicblock-labs/magicblock-engine
          ref: ${{ steps.engine.outputs.revision }}
          path: magicblock-engine
          persist-credentials: false

      - name: Install Rust toolchain
        if: steps.sbf.outputs.ready != 'true'
        working-directory: magicblock-engine
        shell: bash
        run: rustup toolchain install

      - uses: ./magicblock-validator/.github/actions/setup-solana
        if: steps.sbf.outputs.ready != 'true'

      - name: Build v42 calculator
        if: steps.sbf.outputs.ready != 'true'
        working-directory: magicblock-engine
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/release-sbf"
          mkdir -p "$output"
          env -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER cargo build-sbf \
            --manifest-path programs/v42-calculator-program/Cargo.toml \
            --arch v3 --sbf-out-dir "$output" -- --locked
          test -s "$output/v42_calculator_program.so"

      - name: Save release calculator
        if: env.DRY_RUN == 'true' && steps.sbf.outputs.ready != 'true'
        uses: actions/cache/save@v6
        with:
          path: release-sbf/v42_calculator_program.so
          key: ${{ steps.calculator.outputs.cache-primary-key }}

      - name: Publish v42 calculator to GitHub release
        if: env.DRY_RUN == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_VERSION" release-sbf/v42_calculator_program.so --clobber

  publish-wrapper-npm-package:
    name: Publish wrapper NPM packages
    if: ${{ !cancelled() && needs.publish-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [publish-binaries, resolve-dry-run]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-dry-run.outputs.commit || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-solana
        with:
          sbf_tools: "false"

      - name: Publish the NPM package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd .github/packages/npm-package
          npm install
          npm run build
          cd lib
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running npm publish in dry-run mode"
            npm publish --access public --tag "$NPM_CHANNEL" --dry-run
          else
            npm publish --access public --tag "$NPM_CHANNEL"
          fi
