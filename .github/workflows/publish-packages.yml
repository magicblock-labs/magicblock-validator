name: Publish ephemeral validator packages and crates

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  push:
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'The release version'
        required: true
        default: 'v2.0.0'

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.release_version }}
  NPM_CHANNEL: ${{ startsWith(github.event.release.tag_name || inputs.release_version, 'v1.') && 'legacy' || 'latest' }}
  DRY_RUN: ${{ github.event_name != 'release' }}
  RELEASE_BINARIES: magicblock-validator magicblock-verifier magicblock magicblock-validator-tui

jobs:
  validate-release-branch:
    name: Validate release branch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this magicblock-validator
        uses: actions/checkout@v5
        with:
          path: magicblock-validator

      - name: Check versions are aligned
        shell: bash
        run: |
          cd magicblock-validator/.github && ./version-align.sh --check

  # A release event runs this workflow from the tagged commit, so this guard must
  # exist on every branch a tag could point at.
  verify-release:
    name: Verify release source
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this magicblock-validator
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release-line commit carrying the tagged version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          problem=""
          case "$TAG" in
            v1.*) branch=V1 ;;
            v2.*) branch=master ;;
            *) echo "::error::Unsupported release line: $TAG"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            problem="${TAG} points at ${GITHUB_SHA}, which is not on $branch"
          elif ! version="v$(.github/scripts/workspace-version.sh)"; then
            problem="${TAG} points at a commit without a valid workspace version"
          elif [[ "$version" != "$TAG" ]]; then
            problem="${TAG} points at a commit versioned ${version}"
          fi
          if [[ -n "$problem" ]]; then
            gh release edit "$TAG" --draft=true
            echo "::error::${problem}. The release is back in draft; release tags come from the matching release branch."
            exit 1
          fi

  set-release-channel:
    name: Set GitHub release channel
    needs: verify-release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set latest policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_VERSION" --latest=${{ startsWith(github.event.release.tag_name, 'v2.') && 'true' || 'false' }}

  publish-binaries:
    name: Publish Binaries
    permissions:
      contents: write
    needs: verify-release
    if: ${{ !cancelled() && github.event_name != 'push' && needs.verify-release.result != 'failure' }}
    runs-on: ${{ matrix.build.OS }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
            NAME: linux-x64-glibc,
            OS: ubuntu-latest,
            TARGET: x86_64-unknown-linux-gnu
          }
          - {
            NAME: linux-arm64-glibc,
            OS: arm64,
            TARGET: aarch64-unknown-linux-gnu
          }
          - {
            NAME: darwin-x64,
            OS: macos-15-intel,
            TARGET: x86_64-apple-darwin
          }
          - {
            NAME: darwin-arm64,
            OS: macos-latest,
            TARGET: aarch64-apple-darwin
          }

    steps:
      - name: Checkout this magicblock-validator
        uses: actions/checkout@v5
        with:
          path: magicblock-validator
          persist-credentials: false

      - name: Set up GCC
        if: matrix.build.OS == 'ubuntu-latest'
        uses: egor-tensin/setup-gcc@v1.3
        with:
          version: latest

      - name: Install additional build dependencies
        if: startsWith(matrix.build.OS, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev

      - name: Set up macOS build environment
        if: startsWith(matrix.build.OS, 'macos')
        shell: bash
        run: |
          brew install llvm
          llvm=$(brew --prefix llvm)
          echo "$llvm/bin" >> "$GITHUB_PATH"
          {
            echo "LIBCLANG_PATH=$llvm/lib"
            echo "MACOSX_DEPLOYMENT_TARGET=11.0"
            echo "CFLAGS=-mmacosx-version-min=11.0"
            echo "CXXFLAGS=-mmacosx-version-min=11.0"
            echo "LDFLAGS=-mmacosx-version-min=11.0"
            echo "OPENSSL_STATIC=1"
            echo "OPENSSL_VENDORED=1"
          } >> "$GITHUB_ENV"

      - uses: ./magicblock-validator/.github/actions/setup-build-env
        id: build-env
        with:
          cache-key: publish-${{ matrix.build.TARGET }}-release

      - name: Install target
        working-directory: magicblock-validator
        shell: bash
        run: rustup target add ${{ matrix.build.TARGET }}

      - name: Build (linux/macos)
        working-directory: magicblock-validator
        shell: bash
        env:
          TARGET: ${{ matrix.build.TARGET }}
        run: |
          packages=()
          for package in $RELEASE_BINARIES; do
            packages+=(-p "$package")
          done
          cargo build --release --locked --target "$TARGET" "${packages[@]}"

      - name: Check versions are aligned
        shell: bash
        run: |
          cd magicblock-validator/.github && ./version-align.sh --check

      - uses: ./magicblock-validator/.github/actions/save-build-cache
        with:
          key: ${{ steps.build-env.outputs.save-key }}
          path: ${{ steps.build-env.outputs.cache-paths }}

      - name: Build the NPM package
        working-directory: magicblock-validator
        shell: bash
        env:
          ASSET_SUFFIX: ${{ matrix.build.NAME }}
          TARGET: ${{ matrix.build.TARGET }}
        run: |
          bin="ephemeral-validator"
          export node_os="${ASSET_SUFFIX%%-*}"
          arch="${ASSET_SUFFIX#*-}"
          export node_arch="${arch%%-*}"
          export node_pkg="${bin}-${node_os}-${node_arch}"
          echo "node_pkg=${node_pkg}" >> $GITHUB_ENV
          mkdir -p "${node_pkg}/bin"
          envsubst < .github/packages/npm-package/package.json.tmpl > "${node_pkg}/package.json"
          cat "${node_pkg}/package.json"
          cp "target/$TARGET/release/magicblock-validator" "${node_pkg}/bin/${bin}"
          for artifact in $RELEASE_BINARIES; do
            cp "target/$TARGET/release/$artifact" "target/$TARGET/release/$artifact-$ASSET_SUFFIX"
          done

      - name: Publish binaries to GitHub release
        if: env.DRY_RUN == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_SUFFIX: ${{ matrix.build.NAME }}
          TARGET: ${{ matrix.build.TARGET }}
        working-directory: magicblock-validator
        run: |
          for artifact in $RELEASE_BINARIES; do
            gh release upload "$RELEASE_VERSION" "target/$TARGET/release/$artifact-$ASSET_SUFFIX" --clobber
          done

      - name: Publish the NPM package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd magicblock-validator
          echo "DRY_RUN=${{ env.DRY_RUN }}"
          cd ${{ env.node_pkg }}
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
          if [ "${{ env.DRY_RUN }}" = "true" ]; then
            echo "Running npm publish in dry-run mode"
            npm publish --access public --tag "$NPM_CHANNEL" --dry-run
          else
            npm publish --access public --tag "$NPM_CHANNEL"
          fi

  publish-wrapper-npm-package:
    name: Publish wrapper NPM packages
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    needs: publish-binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-solana
        with:
          sbf_tools: "false"

      - name: Publish the NPM package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd .github/packages/npm-package
          npm install
          npm run build
          cd lib
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
          if [ "${{ env.DRY_RUN }}" = "true" ]; then
            echo "Running npm publish in dry-run mode"
            npm publish --access public --tag "$NPM_CHANNEL" --dry-run
          else
            npm publish --access public --tag "$NPM_CHANNEL"
          fi

      - name: cargo publish
        working-directory: programs/magic-interface/
        run: |
          options=()
          if [ "$DRY_RUN" = true ]; then
            options=(--dry-run --no-verify)
          fi
          cargo publish "${options[@]}" --manifest-path=./Cargo.toml --token "$CRATES_TOKEN"
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
