name: Spike / question
description: Ask a design question or request an investigation
labels: [question]
body:
  - type: markdown
    attributes:
      value: >-
        Title: state the decision or unknown concisely in sentence case,
        without a category prefix or terminal punctuation.
        Example: `Determine whether snapshots require versioned manifests`
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What needs to be decided or understood?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add background or prior findings when they help explain the question.
    validations:
      required: false
  - type: textarea
    id: desired-output
    attributes:
      label: Desired output
      description: Specify an answer, recommendation, prototype, or other artifact when not already clear from the question.
    validations:
      required: false
