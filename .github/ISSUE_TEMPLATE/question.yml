name: Spike / question
description: Ask a design question or request an investigation
labels: [question]
body:
  - type: markdown
    attributes:
      value: >-
        Title: the decision or unknown in sentence case,
        without a category prefix or terminal punctuation.
        Example: `Whether snapshots require versioned manifests`
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What needs to be decided or understood?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background or prior findings that help explain the question.
    validations:
      required: false
  - type: textarea
    id: desired-output
    attributes:
      label: Desired output
      description: An answer, recommendation, prototype, or other artifact, when not already clear from the question.
    validations:
      required: false
