name: Feature
description: New capability or improvement
title: "feat: "
labels: ["priority: medium", "enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point does this solve? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired Outcome
      description: What should be true when this is complete? Include important constraints or acceptance criteria.
    validations:
      required: true
