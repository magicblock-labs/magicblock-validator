name: Bug
description: Something is broken or incorrect
title: "bug: "
labels: ["priority: high", "bug"]
body:
  - type: textarea
    id: report
    attributes:
      label: What happened
      description: Describe the bug and what you expected to happen
      placeholder: |
        **Observed:**
        **Expected:**
        **Steps to reproduce:**
        **Environment / logs (if relevant):**
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Revision / version
      description: Provide an exact commit or release. For a checkout, run `git rev-parse --short HEAD`.
      placeholder: "e.g., abc1234 or v0.13.19"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment / discovery context
      description: Where the problem was observed or discovered
      options:
        - Code inspection / not deployment-specific
        - Local (native)
        - Local (Docker)
        - Testnet
        - Mainnet
        - Other
    validations:
      required: true
