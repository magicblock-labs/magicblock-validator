name: Task
description: Track a concrete, scoped unit of work
type: Task
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        Title: start with an imperative verb and describe the completed outcome
        in sentence case, without a category prefix or terminal punctuation.
        Example: `Configure full Rust CI workflow`
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: >-
        Describe the expected result with enough context to explain what success
        looks like, including observable conditions that define completion.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: >-
        Briefly describe the desired code change and where it belongs. Link to
        file:line locations or include a short snippet of the proposed API or type.
        Keep any additional context succinct and to the point.
    validations:
      required: true
