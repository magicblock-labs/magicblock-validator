name: Good First Issue
description: Small, well-scoped task for new contributors
title: ""
labels: ["priority:low", "good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done
    validations:
      required: true

  - type: textarea
    id: starting_points
    attributes:
      label: Starting Points
      description: Provide relevant files, existing behavior, and enough context for a new contributor to begin.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know this is done?
      placeholder: |
        - [ ]
    validations:
      required: true
