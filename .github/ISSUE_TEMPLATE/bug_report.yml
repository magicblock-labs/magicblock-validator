name: Bug report
description: Report something broken, surprising, or regressed
type: Bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Title: describe the observable failure or regression in sentence case,
        without a category prefix or terminal punctuation.
        Example: `Duplicate submissions can strand callers until deadline`
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Include the relevant error or diagnostic evidence.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest reproduction when known. Note if the failure is intermittent.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: Describe what should happen instead when it is not already clear from the problem.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add the revision, crate or path, and environment details when known and relevant.
    validations:
      required: false
