name: Bug report
description: Report something broken, surprising, or regressed
type: Bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Title: the observable failure or regression in sentence case,
        without a category prefix or terminal punctuation.
        Example: `Duplicate submissions can strand callers until deadline`
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Relevant errors or diagnostic evidence help explain the failure.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Smallest known reproduction and whether the failure is intermittent.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen instead, when not already clear from the problem?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant revision, crate or path, and environment details, when known.
    validations:
      required: false
