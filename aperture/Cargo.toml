[package]
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "magicblock-aperture"
repository.workspace = true
version.workspace = true

[dependencies]
# network
fastwebsockets = { workspace = true, features = ["upgrade"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["http1", "http2", "server"] }

# runtime
futures = { workspace = true }
libloading = { workspace = true }
num_cpus = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true }

# magicblock
engine = { workspace = true }
ledger = { workspace = true }
chainsync = { workspace = true }
config = { workspace = true }
mbv-core = { workspace = true }
ledger-deprecated = { workspace = true }
prometheus = { workspace = true }
nucleus = { workspace = true, features = ["metrics", "runtime"] }

# solana
agave-geyser-plugin-interface = { workspace = true }
agave-transaction-view = { workspace = true }
solana-account = { workspace = true }
solana-account-decoder = { workspace = true }
solana-hash = { workspace = true }
solana-message = { workspace = true, features = ["wincode"] }
solana-pubkey = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-signature = { workspace = true }
solana-svm = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
solana-transaction-context = { workspace = true }
solana-transaction-error = { workspace = true }
solana-transaction-status = { workspace = true }
spl-token-2022 = { workspace = true }


# misc
base64 = { workspace = true }
bs58 = { workspace = true }
json = { workspace = true }
keeper = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wincode = { workspace = true }

[lints]
workspace = true
