[workspace]
members = [
    "programs/schedulecommit",
    "programs/schedulecommit-security",
    "schedulecommit/client",
    "schedulecommit/test-scenarios",
    "schedulecommit/test-security",
    "solana-sdk",
    "test-aml",
    "test-cloning",
    "test-committor-service",
    "test-config",
    "test-runner",
    "test-schedule-intent",
    "test-table-mania",
    "test-task-scheduler",
    "test-tools",
    "test-validator-services"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1.0.86"
async-trait = "0.1.77"
bincode = "1.3.3"
borsh = { version = "1.2.1", features = ["derive", "unstable__schema"] }
chrono = "0.4"
cleanass = "0.0.1"
color-backtrace = { version = "0.7" }
ctrlc = "3.4.7"
engine = { package = "magicblock-engine", git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.1.0", features = [
    "testkit"
] }
ephemeral-rollups-sdk = { version = "0.14", default-features = false, features = ["modular-sdk"] }
futures = "0.3.31"
integration-test-tools = { path = "test-tools" }
isocountry = "0.3.2"
keeper = { package = "magicblock-keeper", git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.1.0", features = [
    "testkit"
] }
lazy_static = "1.4.0"
light-client = "0.23"
light-hasher = "5"
light-sdk = "0.23"
light-sdk-types = "0.23"

magicblock-aml = { path = "../magicblock-aml" }
magicblock-chainlink = { path = "../magicblock-chainlink", features = ["dev-context"] }
magicblock-committor-program = { path = "../magicblock-committor-program", features = [
    "no-entrypoint"
] }
magicblock-committor-service = { path = "../magicblock-committor-service" }
magicblock-config = { path = "../magicblock-config" }
magicblock-core = { path = "../magicblock-core" }
magicblock-delegation-program-api = { git = "https://github.com/magicblock-labs/delegation-program.git", rev = "dcd46dc", default-features = false }
magicblock-magic-program-api = { path = "../magicblock-magic-program-api" }
magicblock-program = { path = "../programs/magicblock" }
magicblock-rpc-client = { path = "../magicblock-rpc-client" }
magicblock-table-mania = { path = "../magicblock-table-mania" }
paste = "1.0"
program-schedulecommit = { path = "programs/schedulecommit" }
program-schedulecommit-security = { path = "programs/schedulecommit-security" }
rand = "0.8.5"
rayon = "1.10.0"
rkyv = "0.7.45"
schedulecommit-client = { path = "schedulecommit/client" }
serde = "1.0.217"
serial_test = "3.2.0"
shlex = "1.3.0"
solana-account = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.1.0" }
solana-address = "=2.6.1"
solana-address-lookup-table-interface = "3.0"
solana-clock = "=3.1.1"
solana-commitment-config = "3.1"
solana-compute-budget-interface = "3.0"
solana-hash = "=4.4.0"
solana-instruction = "=3.4.0"
solana-instruction-error = "=2.4.0"
solana-keypair = "=3.1.2"
solana-loader-v2-interface = "3.0"
solana-loader-v3-interface = "7.0"
solana-loader-v4-interface = "3.1"
solana-message = "=4.2.4"
solana-native-token = "=3.0.0"
solana-program = "3.0"
solana-program-pack = "=3.1.0"
solana-program-test = { version = "4.0", features = ["agave-unstable-api"] }
solana-pubkey = { version = "=4.2.0" }
solana-rent = "=4.3.0"
solana-rpc-client = "=4.1.1"
solana-rpc-client-api = "=4.1.1"
solana-sdk = { package = "integration-solana-sdk", path = "solana-sdk" }
solana-sdk-ids = { version = "3.1" }
solana-seed-derivable = "=3.0.0"
solana-signature = "=3.4.1"
solana-signer = "=3.0.1"
solana-system-interface = "=3.2.0"
solana-transaction = "=4.1.5"
solana-transaction-status = "=4.1.1"
solana-transaction-status-client-types = "=4.1.1"
spl-associated-token-account-interface = "2.0"
spl-memo-interface = "2.0"
spl-token = { package = "spl-token-interface", version = "2.0" }
static_assertions = "1.1.0"
teepee = "0.0.1"
tempfile = "3.10.1"
test-config = { path = "test-config" }
tokio = "1.0"
toml = "0.8.13"
tracing = "0.1"
ureq = "2.9.6"
url = "2.5.0"
v42-calculator-interface = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.1.0", features = [
    "builder"
] }

[patch.crates-io]
agave-transaction-view = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.1.0" }
solana-account = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.1.0" }
solana-program-runtime = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.1.0" }
solana-svm = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.1.0" }
solana-transaction-context = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.1.0" }
# Fix libsodium for ARM builds - upstream crates.io version breaks Linux ARM binaries
libsodium-rs = { git = "https://github.com/jedisct1/libsodium-rs.git", rev = "0397a6c5785233f9f2ac91f3eedc3cceb74e0060" }
