[package]
edition.workspace = true
name = "magicblock-chainlink"
version.workspace = true

[dependencies]
arc-swap = "1.7"
async-trait = { workspace = true }
bincode = { workspace = true }
borsh = { workspace = true }
engine = { workspace = true }
futures-util = { workspace = true }
helius-laserstream = { workspace = true }
keeper = { workspace = true }
lru = { workspace = true }
magicblock-aml = { workspace = true }
magicblock-config = { workspace = true }
magicblock-core = { workspace = true }
magicblock-delegation-program-api = { workspace = true }
magicblock-magic-program-api = { workspace = true }
magicblock-metrics = { workspace = true }
nucleus = { workspace = true, features = ["runtime"] }
parking_lot = { workspace = true }
scc = { workspace = true }
solana-account = { workspace = true }
solana-account-decoder = { workspace = true }
solana-account-decoder-client-types = { workspace = true }
solana-address-lookup-table-interface = { workspace = true }
solana-clock = { workspace = true, features = ["wincode"] }
solana-commitment-config = { workspace = true }
solana-feature-set = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-loader-v3-interface = { workspace = true, features = ["serde"] }
solana-loader-v4-interface = { workspace = true, features = ["serde"] }
solana-message = { workspace = true }
solana-program = { workspace = true }
solana-pubkey = { workspace = true }
solana-pubsub-client = { workspace = true }
solana-rent = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true, features = ["wincode"] }
solana-transaction = { workspace = true }
solana-transaction-error = { workspace = true }
spl-token = { workspace = true }
spl-token-2022 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
wincode = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
engine = { workspace = true, features = ["testkit"] }
magicblock-chainlink = { path = ".", features = ["dev-context"] }
magicblock-metrics = { workspace = true, features = ["dev-context"] }
nucleus = { workspace = true, features = ["runtime", "testkit"] }
tempfile = { workspace = true }
v42-calculator-interface = { workspace = true }

[features]
default = []
dev-context = ["engine/testkit", "keeper/testkit", "magicblock-metrics/dev-context"]
