mbv-core = { workspace = true }
magicblock-delegation-program-interface = { workspace = true }
ledger-deprecated = { workspace = true }
metrics = { workspace = true }
program = { workspace = true }
runtime = { workspace = true }
services = { workspace = true }
task-scheduler = { workspace = true }
mimalloc = { workspace = true }
nucleus = { workspace = true }
num_cpus = { workspace = true }
replicator = { workspace = true }
solana-commitment-config = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-native-token = { workspace = true }
solana-program = { workspace = true }
solana-pubkey = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
