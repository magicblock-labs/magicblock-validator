[package]
name = "magicblock-chainsync"
description = "Base-layer account synchronization for MagicBlock"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
base64 = { workspace = true }
derive_more = { workspace = true, features = ["debug", "display", "error"] }
hyper = { workspace = true, features = ["client", "http1"] }
json = { workspace = true }
engine = { workspace = true }
nucleus = { workspace = true, features = ["metrics", "runtime"] }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
solana-account = { workspace = true }
solana-pubkey = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
zstd = { workspace = true }
[dev-dependencies]
http-body-util = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
hyper = { workspace = true, features = ["server"] }
serde_json = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
engine = { workspace = true, features = ["testkit"] }
nucleus = { workspace = true, features = ["testkit"] }
solana-account = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }
[lints]
workspace = true
