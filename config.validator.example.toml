# ==============================================================================
# MagicBlock Validator Configuration
# ==============================================================================
# This file serves as a reference for all available configuration options.
# ALL FIELDS ARE OPTIONAL. If removed, the "Default" value listed in the
# comments will be used.
#
# CONFIGURATION PRECEDENCE (Highest to Lowest):
# 1. CLI Arguments      (e.g. --listen 127.0.0.1:8899)
# 2. Environment Vars   (e.g. MBV_ENGINE__LEDGER__SIZE_LIMIT=536870912)
# 3. TOML Config File   (this file)
# 4. System Defaults
#
# ENVIRONMENT VARIABLES:
# Prefix: MBV_
# Splitter: Double underscore (__) denotes hierarchy depth.
# Naming:   Field names use UPPER_SNAKE_CASE.
# Example:  [engine.blockstore] blocktime -> MBV_ENGINE__BLOCKSTORE__BLOCKTIME
# ==============================================================================

# --- Core Settings ---

[metrics]
# Network address to bind the metrics service to.
# Default: "127.0.0.1:9090"
# Env: MBV_METRICS__ADDRESS
address = "127.0.0.1:9090"

# ==============================================================================
# Engine
# ==============================================================================
[engine.authority]
# The validator's identity keypair in Base58 format.
# Default: A pre-generated devnet keypair
# Env: MBV_ENGINE__AUTHORITY__LOCAL
local = "9Vo7TbA5YfC5a33JhAi9Fb41usA6JwecHNRw3f9MzzHAM8hFnXTzL5DcEHwsAFjuUZ8vNQcJ4XziRFpMc3gTgBQ"

[engine.accountsdb]
# AccountsDB lives under the ledger root by default.
directory = "magicblock-test-storage/accountsdb"
# Maximum number of recently loaded accounts retained in memory.
lru-capacity = 5000

[engine.blockstore]
blocktime = "400ms"
# Slots per superblock; 0 disables periodic sealing.
superblock = 72000

[engine.ledger]
# Shared durable root for the engine ledger, deprecated ledger, and service databases.
directory = "magicblock-test-storage"
size-limit = 536_870_912

[engine.replication]
# Nodes configured through LeaderParams are leaders.
allowed-followers = ["L12m1UhkJRfHyvLMcVucJwxXeuD728EqVDDwQDxFMNo"]
bind-address = "127.0.0.1:10000"

[aperture]
# Network address to bind the main JSON RPC service to.
# Websocket bind address is derived by incrementing the port
# Default: "127.0.0.1:8899"
# CLI: -l, --listen <ADDR>
# Env: MBV_APERTURE__LISTEN
listen = "127.0.0.1:8899"

# List of paths to geyser json configuration files
# Default: empty list (no plugins)
geyser-plugins = ["config.json"]

# ==============================================================================
# Chain Commitment Strategy (ER -> BASE)
# ==============================================================================
[commit]
# The compute unit price (in micro-lamports) applied to commit transactions.
# Default: 1_000_000
# Env: MBV_COMMIT__COMPUTE_UNIT_PRICE
compute-unit-price = 1_000_000

# ==============================================================================
# Deprecated Ledger Compatibility
# ==============================================================================
[ledger]
# Capacity in bytes of the RocksDB block cache shared by all ledger columns.
# This is the only read caching layer (the ledger bypasses the OS page cache),
# so production nodes should set 16 GB or more.
# Default: 536_870_912 (512 MB)
# Env: MBV_LEDGER__BLOCK_CACHE_SIZE
block-cache-size = 536_870_912

# Whether to verify that the ledger on disk belongs to the configured keypair.
# Default: true
# Env: MBV_LEDGER__VERIFY_KEYPAIR
verify-keypair = true

# If true, deletes the existing ledger directory on startup.
# Default: false
# Env: MBV_LEDGER__RESET
reset = false


# ==============================================================================
# ChainSync (base-chain account acquisition and lifecycle updates)
# ==============================================================================
[chainsync]
# All providers must serve the same base chain. The first HTTP URL also serves
# settlement and operator RPC calls. Omitted HTTP defaults to devnet; omitted
# WebSocket providers are derived from the first HTTP URL.
http = ["https://api.devnet.solana.com"]

[[chainsync.websocket]]
url = "wss://api.devnet.solana.com"
max-connections = 4
subs-per-connection = 900
# Every stream monitors delegation lifecycle events and Clock.
# Duplication delay must be nonzero and is configured per stream.
[[chainsync.grpc]]
endpoint = "https://laserstream-devnet-ewr.helius-rpc.com"
token = "YOUR_API_KEY"
duplication-delay = "30m"

# Optional signer assessment; all distinct post-delegation action signers are checked.
# Supply the full /risk endpoint. HTTPS is required except for loopback HTTP.
# [chainsync.aml]
# endpoint = "http://127.0.0.1:3001/risk"
# timeout = "5s"

# ==============================================================================
# Pre-loaded Programs
# ==============================================================================
# You can specify multiple programs to load at startup.
# Default: Empty list

[[programs]]
id = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
path = "./libs/spl_token.so"

[[programs]]
id = "Memo1UhkJRfHyvLMcVucJwxXeuD728EqVDDwQDxFMNo"
path = "./libs/spl_memo.so"
