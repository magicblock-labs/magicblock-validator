[package]
authors.workspace = true
description = "Magicblock magic program api"
edition.workspace = true
homepage.workspace = true
license = "MIT"
name = "magicblock-magic-program-api"
repository.workspace = true
version.workspace = true

[dependencies]
const-crypto = "0.3.0"
serde = { version = "^1.0.228", features = ["derive"] }
solana-hash = { workspace = true, features = ["serde", "wincode"] }
solana-program = { workspace = true }
solana-signature = { workspace = true, features = ["serde", "wincode"] }
# Task requests cross into the engine through its wincode-encoded service
# message queue, so the types they are built from need a wincode schema.
solana-instruction = { workspace = true, features = ["wincode"] }
wincode = { workspace = true }

[lints]
workspace = true
