[package]
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "magicblock-core"
repository.workspace = true
version.workspace = true

[dependencies]

console-subscriber = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
wincode = { workspace = true }

magicblock-magic-program-api = { workspace = true }
serde = { workspace = true, features = ["derive"] }
solana-account = { workspace = true, features = ["wincode"] }
solana-clock = { workspace = true }
solana-hash = { workspace = true, features = ["wincode"] }
solana-message = { workspace = true }
solana-program = { workspace = true }
solana-pubkey = { workspace = true, features = ["wincode"] }
solana-signature = { workspace = true }
solana-transaction-error = { workspace = true }
spl-token = { workspace = true }
spl-token-2022 = { workspace = true }

tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true, features = ["time"] }

[features]
tokio-console = ["console-subscriber", "tokio/tracing"]
