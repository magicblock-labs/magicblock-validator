# ==============================================================================
# MagicBlock Validator Configuration
# ==============================================================================
# This file serves as a reference for all available configuration options.
# ALL FIELDS ARE OPTIONAL. If removed, the "Default" value listed in the
# comments will be used.
#
# CONFIGURATION PRECEDENCE (Highest to Lowest):
# 1. CLI Arguments      (e.g. --lifecycle offline)
# 2. Environment Vars   (e.g. MBV_ENGINE__LEDGER__SIZE_LIMIT=536870912)
# 3. TOML Config File   (this file)
# 4. System Defaults
#
# ENVIRONMENT VARIABLES:
# Prefix: MBV_
# Splitter: Double underscore (__) denotes hierarchy depth.
# Naming:   Field names use UPPER_SNAKE_CASE.
# Example:  [engine.blockstore] blocktime -> MBV_ENGINE__BLOCKSTORE__BLOCKTIME
# ==============================================================================

# --- Core Settings ---

# The operational mode of the validator.
# Default: "ephemeral"
# Options:
# - "ephemeral":       Clone accounts on demand; writes only to delegated accounts.
# - "replica":         Clone all accounts; writes to all accounts.
# - "programs-replica": Clone program accounts; writes to all accounts.
# - "offline":         Clone no accounts; writes to all accounts.
# CLI: --lifecycle <MODE>
# Env: MBV_LIFECYCLE
lifecycle = "ephemeral"

# Remote endpoints for syncing with the base chain.
# You can specify multiple remotes of different types.
# The first HTTP/HTTPS remote will be used for JSON-RPC calls.
# Each WebSocket/gRPC remote creates a subscription client.
#
# Supported URL schemes:
# - "http", "https":  JSON-RPC HTTP connections
# - "ws", "wss":      WebSocket connections for PubSub
# - "grpc", "grpcs":  gRPC connections for streaming
#
# URL Aliases (resolved during parsing):
# - "mainnet":   resolves to https://api.mainnet-beta.solana.com/
# - "devnet":    resolves to https://api.devnet.solana.com/
# - "testnet":   resolves to https://api.testnet.solana.com/
# - "localhost": resolves to http://localhost:8899/ (only for http/https schemes)
#
# Examples:
# remotes = ["devnet"]                                    # Single devnet HTTP endpoint
# remotes = ["mainnet", "wss://mainnet-beta.solana.com"] # Mainnet with explicit WebSocket
# remotes = ["http://localhost:8899", "ws://localhost:8900"] # Local endpoints
#
# If no remotes are specified, defaults to ["devnet"] with an auto-added WebSocket endpoint.
# Default: ["https://api.devnet.solana.com/"]
# Env: Not supported (must be configured via TOML or CLI)
# Note: gRPC remote requires a Helius API key/token.
# Example format: grpcs://<network>.helius-rpc.com?api-key=<YOUR_API_KEY>
# See Helius gRPC docs for available network endpoints.
remotes = [
    "grpcs://laserstream-devnet-ewr.helius-rpc.com?api-key=YOUR_API_KEY",
    "https://api.devnet.solana.com",
    "wss://api.devnet.solana.com"
]

[metrics]
# Network address to bind the metrics service to.
# Default: "127.0.0.1:9090"
# Env: MBV_METRICS__ADDRESS
address = "127.0.0.1:9090"

# Frequency at which to collect metrics. Supports humantime (e.g. "30s", "1m").
# Default: "30s"
# Env: MBV_METRICS__COLLECT_FREQUENCY
collect-frequency = "30s"

# ==============================================================================
# gRPC (applies to all gRPC providers)
# ==============================================================================
[grpc]
# The maximum number of subscriptions that are added to a single optimized stream
# Default: 5000
# Env: MBV_GRPC__MAX_SUBS_IN_OLD_OPTIMIZED
max-subs-in-old-optimized = 5000
# The maximum number of old unoptimized subscriptions streams allowed until optimization is triggered
# Default: 5
# Env: MBV_GRPC__MAX_OLD_UNOPTIMIZED
max-old-unoptimized = 5
# The maximum number of subscriptions held in the current new stream which is updated frequently
# Default: 400
# Env: MBV_GRPC__MAX_SUBS_IN_NEW
max-subs-in-new = 400

# Maximum time without optimization before triggering optimization (in seconds)
# if not triggered by exceeding max-old-unoptimized.
# If not provided it defaults to 60 seconds.
# Env: MBV_GRPC__MAX_TIME_WITHOUT_OPTIMIZATION_SECS
max-time-without-optimization-secs = 60

# ==============================================================================
# Engine
# ==============================================================================
[engine.authority]
# The validator's identity keypair in Base58 format.
# Default: A pre-generated devnet keypair
# Env: MBV_ENGINE__AUTHORITY__LOCAL
local = "9Vo7TbA5YfC5a33JhAi9Fb41usA6JwecHNRw3f9MzzHAM8hFnXTzL5DcEHwsAFjuUZ8vNQcJ4XziRFpMc3gTgBQ"

[engine.accountsdb]
# AccountsDB lives under the ledger root by default.
directory = "magicblock-test-storage/accountsdb"
# Maximum number of recently loaded accounts retained in memory.
lru-capacity = 5000

[engine.blockstore]
blocktime = "400ms"
superblock = 72000

[engine.ledger]
# Shared durable root for the engine ledger, deprecated ledger, and service databases.
directory = "magicblock-test-storage"
size-limit = 536_870_912

[engine.replication]
# Nodes configured through LeaderParams are leaders.
allowed-followers = ["L12m1UhkJRfHyvLMcVucJwxXeuD728EqVDDwQDxFMNo"]
bind-address = "127.0.0.1:10000"

[aperture]
# Network address to bind the main JSON RPC service to.
# Websocket bind address is derived by incrementing the port
# Default: "127.0.0.1:8899"
# CLI: -l, --listen <ADDR>
# Env: MBV_APERTURE__LISTEN
listen = "127.0.0.1:8899"

# Number of event processor tasks to handle state updates
# Greater number might improve the performance of websocket
# and/or geyser plugins if there are enough idle CPU cores
# Default: 1
# CLI: --event-processors <COUNT>
# Env: MBV_APERTURE__EVENT_PROCESSORS
event-processors = 1

# List of paths to geyser json configuration files
# Default: empty list (no plugins)
geyser-plugins = ["config.json"]

# ==============================================================================
# Chain Commitment Strategy (ER -> BASE)
# ==============================================================================
[commit]
# The compute unit price (in micro-lamports) applied to commit transactions.
# Default: 1_000_000
# Env: MBV_COMMIT__COMPUTE_UNIT_PRICE
compute-unit-price = 1_000_000

# ==============================================================================
# Deprecated Ledger Compatibility
# ==============================================================================
[ledger]
# Capacity in bytes of the RocksDB block cache shared by all ledger columns.
# This is the only read caching layer (the ledger bypasses the OS page cache),
# so production nodes should set 16 GB or more.
# Default: 536_870_912 (512 MB)
# Env: MBV_LEDGER__BLOCK_CACHE_SIZE
block-cache-size = 536_870_912

# Whether to verify that the ledger on disk belongs to the configured keypair.
# Default: true
# Env: MBV_LEDGER__VERIFY_KEYPAIR
verify-keypair = true

# If true, deletes the existing ledger directory on startup.
# Default: false
# Env: MBV_LEDGER__RESET
reset = false


# ==============================================================================
# Chainlink (cloning pipeline)
# ==============================================================================
[chainlink]
# Maximum number of accounts to monitor for price updates.
# Default: 5000
# Env: MBV_CHAINLINK__MAX_MONITORED_ACCOUNTS

# Delay between resubscribing to accounts after a pubsub reconnection.
# This throttles the rate at which we resubscribe to prevent overwhelming the RPC provider.
# Supports humantime format (e.g. "50ms", "200ms", "1s").
# For example, with 50ms delay, resubscribing to 1000 accounts would take ~50 seconds.
# Default: "50ms"
# Env: MBV_CHAINLINK__RESUBSCRIPTION_DELAY
# resubscription-delay = "50ms"

# Period for polling DLP-owned UndelegationRequest accounts as a backfill for
# missed subscription updates. Set to "0s" to disable polling.
# Default: "5m"
# Env: MBV_CHAINLINK__UNDELEGATION_REQUEST_POLL_INTERVAL
# undelegation-request-poll-interval = "5m"

# Maximum subscriptions per websocket connection.
# Default: 900
# Env: MBV_CHAINLINK__WS_SUBS_PER_CONNECTION
# ws-subs-per-connection = 900

# ------------------------------------------------------------------------------
# Optional: Range Risk API validation for post-delegation actions signers
# ------------------------------------------------------------------------------
# When enabled, all signers referenced by post-delegation actions are checked
# against Range API before actions are allowed to execute.
[chainlink.risk]
# Enables/disables address risk checks against the risk server.
# Default: false
# Env: MBV_CHAINLINK__RISK__ENABLED
enabled = false

# Base URL of the risk server that performs address risk assessments.
# The risk server owns the upstream provider credentials, cache, and threshold.
# Default: "http://127.0.0.1:3001"
# Env: MBV_CHAINLINK__RISK__RISK_SERVER_URL
risk-server-url = "http://127.0.0.1:3001"

# HTTP timeout for risk server calls.
# Default: "5s"
# Env: MBV_CHAINLINK__RISK__REQUEST_TIMEOUT
request-timeout = "5s"

# ==============================================================================
# Leader Administration (Optional)
# ==============================================================================
# This section is optional. Remove it to disable periodic fee claims.

[admin]
# How often to claim accrued fees from the chain (e.g. "24h").
# Env: MBV_ADMIN__CLAIM_FEES_FREQUENCY
claim-fees-frequency = "24h"

# ==============================================================================
# Internal Task Scheduler
# ==============================================================================
[task-scheduler]
# If true, clears all pending scheduled tasks on startup.
# Default: false
# Env: MBV_TASK_SCHEDULER__RESET
reset = false

# The minimum interval between task executions.
# Supports humantime (e.g. "10ms", "1s").
# Default: "10ms"
# Env: MBV_TASK_SCHEDULER__MIN_INTERVAL
min-interval = "10ms"

# How long failed task executions and failed scheduling records are retained.
# Supports humantime (e.g. "1h", "7d").
# Default: "14d"
# Env: MBV_TASK_SCHEDULER__FAILED_TASK_RETENTION
failed-task-retention = "14d"

# How often old failed task executions and failed scheduling records are deleted.
# Supports humantime (e.g. "1m", "1h").
# Default: "1h"
# Env: MBV_TASK_SCHEDULER__FAILED_TASK_CLEANUP_INTERVAL
failed-task-cleanup-interval = "1h"

# ==============================================================================
# Pre-loaded Programs
# ==============================================================================
# You can specify multiple programs to load at startup.
# Default: Empty list

[[programs]]
id = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
path = "./libs/spl_token.so"

[[programs]]
id = "Memo1UhkJRfHyvLMcVucJwxXeuD728EqVDDwQDxFMNo"
path = "./libs/spl_memo.so"
